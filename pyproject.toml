[project]
name = "chainscope"
version = "0.1.0"
description = "CHAINSCOPE — Crypto Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    # Transport — spider-nix como engine de coleta web (Tier 3-4)
    "spider-nix @ file:///home/kernelcore/master/staging/spider-nix",



    # HTTP clients
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",           # WebSocket streams (blocos real-time, orderbook)

    # Serialization / performance
    "orjson>=3.9.0",            # JSON ultrarrápido (substitui json stdlib)
    "msgpack>=1.0.0",           # Serialização binária para filas internas
    "zstandard>=0.22.0",        # Compressão de payloads grandes

    # Validation & schemas
    "pydantic>=2.0.0",
    "jsonschema>=4.21.0",

    # Storage clients
    "asyncpg>=0.29.0",          # TimescaleDB / Postgres
    "redis[asyncio]>=5.0.0",    # Redis cache + rate limit state
    "neo4j>=5.17.0",            # Neo4j knowledge graph
    "qdrant-client>=1.8.0",     # Vector DB para embeddings
    "clickhouse-connect>=0.7.0",# ClickHouse analytics

    # Graph / subgraph
    "gql[aiohttp]>=3.5.0",      # GraphQL client (The Graph, Snapshot, Tally)
    "web3>=6.15.0",             # Ethereum JSON-RPC + ABI decoding

    # Feed / document parsing
    "feedparser>=6.0.0",        # RSS/Atom feeds
    "pypdf>=4.0.0",             # Extração de whitepapers PDF
    "markdownify>=0.11.0",      # HTML → Markdown para LLM

    # Observability
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",

    # Scheduling
    "apscheduler>=3.10.0",      # Job scheduler para coletas periódicas
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
